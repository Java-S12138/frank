<!DOCTYPE html>
<html lang="en">
  <head>
     <title>Frank 最近战绩</title>
    <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="../assets/icon/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="main.ts"></script>
    <script>document.addEventListener('contextmenu', function (event) {
      event.preventDefault()
    })</script>
    <script>
      document.addEventListener('keydown', function(event) {
        // 检查是否按下的是 Tab 键
        if (event.key === 'Tab') {
          event.preventDefault(); // 阻止 Tab 键的默认行为
        }
      });
    </script>
  </body>
</html>
